name: Bug 报告
description: 报告可复现的问题（崩溃、连接失败、校准异常、UI 错误等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。涉及 USB / 校准的问题，请尽量附上设备日志和复现步骤。
        提交前请先搜索是否已有相同 issue。
  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 在「设备」页或系统应用信息中查看，例如 0.3.0 (4)
      placeholder: "0.3.0 (4)"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android 版本与设备
      placeholder: "Android 17 / Xiaomi Pad 7"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: 连接的硬件
      multiple: true
      options:
        - LibreVNA V1
        - LibreVNA P2
        - LibreVNA PT
        - Harogic B60 / VNB-60
        - LibreCAL / ECB-60 电子校准件
        - 演示模式
        - 其他 / 不确定
  - type: input
    id: firmware
    attributes:
      label: 固件版本
      placeholder: "B60 FW 1.8.6 / E-Cal FW 0.3.2"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，按顺序列出操作
      placeholder: |
        1. 连接 B60
        2. 设置 401 点 / 75 kHz
        3. 点击「开始扫描」
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 设备页「日志」中的内容，或崩溃堆栈、录屏。请隐去序列号等敏感信息。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，没有发现相同问题。
          required: true
        - label: 我使用的是仓库 README 中说明的受支持设备/版本。
          required: false
